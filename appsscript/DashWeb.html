<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강언/바비톡 로테이션 대시보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 운영자 대시보드 — 위 상태줄, 왼쪽 그날 작업(3단계 파이프라인), 오른쪽 폰보드 40칸, 아래 달력과 로그. 상세는 오른쪽 서랍. */
:root{
  --bg:#EDF1F0; --panel:#FFFFFF; --panel-2:#F5F8F7; --ink:#15201E; --muted:#5C6966; --line:#D6DEDC; --accent:#0B6B63;
  --ok:#1D8549; --ok-bg:#E1F3E8; --fail:#C4342A; --fail-bg:#FBE5E2; --run:#2460C4; --run-bg:#E2EBFA;
  --wait:#76827F; --wait-bg:#ECF0EF; --hold:#9A6F12; --hold-bg:#F7EED6; --gone:#6B7573; --gone-bg:#DDE2E1;
  --r1:#2D6CDF; --r2:#0E8C7E; --r3:#B9700F; --r4:#7A4BD8; --r5:#B8336A;
  --f-body:"IBM Plex Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  --f-num:"JetBrains Mono",Consolas,ui-monospace,monospace;
  --shadow:0 1px 0 rgba(20,40,36,.04),0 6px 18px -12px rgba(20,40,36,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1600px;margin:0 auto;padding:16px;display:grid;gap:14px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;box-shadow:var(--shadow);
  position:sticky;top:8px;z-index:20}  /* 틀고정: 아래로 내려도 날짜·자동 실행·버튼이 항상 보이게 */
.top::before{content:"";position:absolute;left:-17px;right:-17px;top:-9px;height:9px;background:var(--bg)}  /* 고정된 머리 위로 내용이 비쳐 보이지 않게 */
.brand{display:grid}
.brand small{color:var(--muted);font-size:12px}
.brand b{font-size:18px;font-weight:700}
.brand .ver{font-family:var(--f-num);font-size:11px;font-weight:700;color:var(--accent);background:var(--ok-bg);border-radius:5px;padding:1px 6px;vertical-align:middle}
.today{display:flex;align-items:baseline;gap:8px;padding-left:20px;border-left:1px solid var(--line)}
.today .d{font-size:16px;font-weight:600}
.today .w{color:var(--muted)}
.tools{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.auto{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--wait-bg);color:var(--wait);font-weight:600;font-size:13px;border:1px solid var(--line);cursor:pointer}
.auto i{width:8px;height:8px;border-radius:50%;background:currentColor}
.auto.on{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.auto.on i{animation:blink 1.6s infinite}
.auto.off-window{background:var(--hold-bg);color:var(--hold);border-color:var(--hold)}
@keyframes blink{50%{opacity:.35}}
.btn.danger{background:var(--fail);border-color:var(--fail);color:#fff}
.sync{font-size:12px;font-weight:600;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.sync.stale{color:var(--fail);background:var(--fail-bg);border-color:var(--fail)}
/* 웹앱 보기 전용(시트 주인이 아닌 사람): 실제로 폰을 움직이는 버튼은 숨김 */
body.readonly #checkBtn,body.readonly .actions,body.readonly [data-check]{display:none!important}
body.readonly #autoBtn{pointer-events:none}
.busy{color:var(--run);font-weight:600;font-size:13px}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

.main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow);min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:12px}
.ph h2{margin:0;font-size:15px;font-weight:700}
.sub{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-fail{background:var(--fail-bg);color:var(--fail)}
.c-run{background:var(--run-bg);color:var(--run)} .c-wait{background:var(--wait-bg);color:var(--wait)}
.c-hold{background:var(--hold-bg);color:var(--hold)} .c-miss{background:var(--fail-bg);color:var(--fail)}
.c-none{background:var(--panel-2);color:var(--muted)} .c-gone{background:var(--gone-bg);color:var(--gone)}

.jobs{display:grid;gap:8px}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.job{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:58px 64px 66px minmax(90px,1fr) minmax(0,2.2fr) 80px;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--wait);border-radius:8px;background:var(--panel)}
.job:hover{background:var(--panel-2)}
.job:focus-visible{outline:2px solid var(--accent)}
.job.s-ok{border-left-color:var(--ok)} .job.s-fail,.job.s-miss{border-left-color:var(--fail)} .job.s-run{border-left-color:var(--run)}
.job.s-hold{border-left-color:var(--hold)} .job.s-none{border-left-color:var(--line)}
.jt b{display:block;font-family:var(--f-num);font-size:15px}
.jt span{font-size:11px;color:var(--muted)}
.jp{font-family:var(--f-num);font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.jp small{display:block;font-family:var(--f-body);font-size:10px;font-weight:500;color:var(--muted)}
.ji b{display:block;font-weight:600} .ji span{font-size:12px;color:var(--muted)}
.rot{display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;color:#fff;white-space:nowrap}
.r1{background:var(--r1)} .r2{background:var(--r2)} .r3{background:var(--r3)} .r4{background:var(--r4)} .r5{background:var(--r5)}
.pill{justify-self:end;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}

.pipe{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.pipe li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding-right:8px;min-width:0}
.pipe li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pipe li::before{content:"";flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:2px solid var(--line);background:var(--panel);color:#fff}
.pipe li.ok{color:var(--ink)} .pipe li.ok::before{content:"✓";background:var(--ok);border-color:var(--ok)}
.pipe li.fail{color:var(--fail);font-weight:600} .pipe li.fail::before{content:"✕";background:var(--fail);border-color:var(--fail)}
.pipe li.run{color:var(--run);font-weight:600} .pipe li.run::before{border-color:var(--run);border-top-color:transparent;animation:spin 1s linear infinite}
.pipe li.hold{color:var(--hold)} .pipe li.hold::before{content:"‖";background:var(--hold);border-color:var(--hold)}
.pipe li.skip::before{content:"–";color:var(--muted)}

.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:grid;gap:3px;justify-items:center;padding:8px 2px 7px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:0}
.tile:hover{border-color:var(--accent)}
.tile:focus-visible{outline:2px solid var(--accent)}
.tile b{font-family:var(--f-num);font-size:18px;font-weight:700;line-height:1}
.tile .lb{font-size:10px;font-weight:600;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.tile .rt{font-size:10px;font-weight:700;color:#fff;border-radius:4px;padding:1px 5px;line-height:1.3}
.tile .rt.none{background:transparent;color:transparent}
.tile .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--line)}
.tile.in{background:var(--ok-bg)} .tile.in .dot{background:var(--ok)} .tile.in .lb{color:var(--ok)}
.tile.out{background:var(--hold-bg);border-color:var(--hold)} .tile.out .dot{background:var(--hold)} .tile.out .lb{color:var(--hold)}
.tile.unknown{background:var(--fail-bg);border-color:var(--fail)} .tile.unknown .dot{background:var(--fail)} .tile.unknown .lb{color:var(--fail)}
.tile.gone{background:var(--gone-bg)} .tile.gone .dot{background:var(--gone)} .tile.gone .lb{color:var(--gone)}
.tile.none .lb{color:var(--muted)}
.tile.assigned{box-shadow:inset 0 0 0 2px var(--accent)}
.alerts{margin-top:12px;display:grid;gap:6px}
/* 문제 폰 한 줄: 번호 | 짧은 이유(칩) | 긴 설명 (+ 이날 작업 있음) — 줄이 넘어가도 설명 칸 안에서만 */
.alert{display:grid;grid-template-columns:34px auto minmax(0,1fr);gap:4px 10px;align-items:start;font-size:13px;line-height:1.45;padding:8px 10px;border-radius:8px;border:1px solid transparent}
.alert .an{font-family:var(--f-num);font-weight:700;font-size:14px}
.alert .at{font-weight:700;white-space:nowrap}
.alert .ad{color:var(--ink);opacity:.8;min-width:0;overflow-wrap:anywhere}
.alert .aw{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;padding:0 6px;border-radius:4px;background:var(--panel);border:1px solid currentColor;white-space:nowrap}
.alert.c-fail{border-color:#F1C4BE} .alert.c-hold{border-color:#EAD9AE} .alert.c-gone{border-color:var(--line)}
/* 문제 폰 접어두기 (2026-10-22): 접으면 이유별 개수만, 펴면 같은 이유끼리 한 줄로 묶어 번호 나열 */
.alerts details{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.alerts summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 10px;font-size:13px;font-weight:700}
.alerts summary::-webkit-details-marker{display:none}
.alerts summary::before{content:'▸';color:var(--muted);transition:transform .15s}
.alerts details[open] summary::before{transform:rotate(90deg)}
.alerts summary .sc{font-size:12px;font-weight:700;padding:1px 7px;border-radius:999px;border:1px solid currentColor}
.alerts summary .sc.c-fail{color:var(--fail)} .alerts summary .sc.c-hold{color:var(--hold)} .alerts summary .sc.c-gone{color:var(--muted)}
.alerts .ab{display:grid;gap:6px;padding:0 8px 8px}
.alert .nums{display:grid;grid-template-columns:repeat(auto-fill,34px);gap:4px}
/* 번호 칩은 모두 같은 크기. 고른 날 작업 있는 폰만 테두리 색 (.job 은 작업 목록 카드 이름이라 쓰지 않음) */
.alert .nums b{box-sizing:border-box;height:22px;line-height:20px;text-align:center;font-family:var(--f-num);font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.alert .nums b.wk{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.alert .ad > div{margin-top:4px}

.calhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.calhead h2{margin:0;font-size:15px;min-width:110px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .hd{font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.cal .hd.sun{color:var(--fail)}
.day{all:unset;box-sizing:border-box;cursor:pointer;min-height:70px;padding:6px 7px;border:1px solid var(--line);border-radius:8px;background:var(--panel);display:grid;align-content:start;gap:4px;min-width:0}
.day:hover{border-color:var(--accent)}
.day:focus-visible{outline:2px solid var(--accent)}
.day.blank{visibility:hidden}
.day.past{background:var(--panel-2)}
.day.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day .tr{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.day .dn{font-family:var(--f-num);font-weight:700}
.day.is-today .dn{background:var(--accent);color:#fff;padding:0 6px;border-radius:5px}
.day .wk{font-size:10px;color:var(--muted);white-space:nowrap}
.day .dots{display:flex;flex-wrap:wrap;gap:3px}
.day .dots i{width:9px;height:9px;border-radius:2px;background:var(--wait-bg);border:1px solid var(--wait)}
.day .dots i.ok{background:var(--ok);border-color:var(--ok)} .day .dots i.fail,.day .dots i.miss{background:var(--fail);border-color:var(--fail)}
.day .dots i.run{background:var(--run);border-color:var(--run)} .day .dots i.hold{background:var(--hold);border-color:var(--hold)}
.day .dots i.none{background:var(--line);border-color:var(--line)}
.day .cnt{font-size:11px;color:var(--muted)}
.day.skip6{cursor:default;background:repeating-linear-gradient(135deg,var(--panel-2) 0 6px,var(--panel) 6px 12px)}
.calnote{margin:10px 0 0;font-size:12px;color:var(--muted)}

.daydetail{margin-top:14px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}
.daydetail h3{margin:0 0 2px;font-size:14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.drow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:52px 62px 62px 120px minmax(0,1fr) 210px 64px;gap:12px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-left:4px solid var(--wait);border-radius:8px;background:var(--panel)}
.drow:hover{background:var(--panel-2)}
.drow:focus-visible{outline:2px solid var(--accent)}
.drow.s-ok{border-left-color:var(--ok)} .drow.s-fail,.drow.s-miss{border-left-color:var(--fail)} .drow.s-run{border-left-color:var(--run)} .drow.s-none{border-left-color:var(--line)}
/* 올라간 글은 줄 전체를 초록으로 (오른쪽 작은 표시만으로는 구분이 안 된다는 요청) */
.drow.s-ok,.job.s-ok{background:var(--ok-bg);border-color:var(--ok)}
.drow.s-ok:hover,.job.s-ok:hover{background:#D3EEDD}
.drow.s-fail,.job.s-fail{background:var(--fail-bg)}
.drow.s-run,.job.s-run{background:var(--run-bg)}
.drow .h{font-family:var(--f-num);font-weight:700}
.drow .no{font-family:var(--f-num);font-size:20px;font-weight:700;line-height:1}
.drow .no small{font-family:var(--f-body);font-size:10px;font-weight:500;color:var(--muted);margin-left:2px}
.drow .sg b{display:block} .drow .sg span{font-size:12px;color:var(--muted)}
.drow .tx{font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .up{font-size:12px;color:var(--muted);line-height:1.4;min-width:0}
.drow .up a{color:var(--accent);font-family:var(--f-num);text-decoration:none}
.drow .up a:hover{text-decoration:underline}
.drow .up div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 두 단: 왼쪽 작업 목록·달력, 오른쪽 폰보드·로그 (오른쪽은 아래로 내려도 따라옴) */
/* 4분할 — 위 = 작업 목록 | 폰보드, 아래 = 달력 | 로그. 칸 안에서 스크롤하지 않고 내용만큼 늘어나
   목록·폰보드·달력이 한눈에 다 보이게 (2026-10-13 요청). 같은 줄의 두 칸은 높이를 맞춤.
   로그만 길어서, 옆 달력 높이에 맞춘 칸 안에서 스크롤. */
.quad{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:stretch}
.q{display:flex;flex-direction:column;min-height:0;padding:14px 16px}
.q > .ph,.q > .calhead,.q > .legend{flex:none}
.qbody{flex:1 1 auto}
.q .jobs{align-content:start}
.boardpanel .legend{margin-bottom:10px}
/* 4분할에선 작업 칸이 좁아 앞 칸들을 줄이고 가운데(글·3단계)를 넓힘 */
.quad .row{grid-template-columns:54px 46px 56px 82px minmax(0,1fr) 180px 46px;gap:8px;padding:8px 10px}
.quad .row .no{font-size:20px} .quad .pill{padding:3px 7px}
.logpanel{min-height:320px}
.logpanel .logbox{flex:1 1 0;height:0;min-height:0}   /* 내용이 칸을 늘리지 않게 — 높이는 옆 달력이 정함 */
.logbox{flex:1;min-height:0;overflow:auto;font-family:var(--f-num);font-size:12px;line-height:1.55;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.logbox .ln{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;padding:2px 0;border-bottom:1px dashed var(--line);overflow-wrap:anywhere}
.logbox .ln time{color:var(--muted)}
.logbox .ln.err{color:var(--fail);font-weight:600} .logbox .ln.ok{color:var(--ok);font-weight:600} .logbox .ln.info{color:var(--run)}
.logbox .empty-log{color:var(--muted);padding:8px 0}
.btn.tiny{padding:2px 9px;font-size:12px}
.btn.tiny[aria-pressed="true"]{background:var(--fail-bg);border-color:var(--fail);color:var(--fail)}
/* 좁은 화면(노트북 세로·폰): 한 줄로 쌓고 칸 높이는 내용대로 */
@media (max-width:1100px){.quad{grid-template-columns:minmax(0,1fr)}.logpanel{height:360px}}

/* 작업 목록 한 줄 (예전 '작업 목록' + '달력 아래 목록' 을 하나로) */
.row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:62px 52px 62px 96px minmax(0,1fr) 205px 58px;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-left:4px solid var(--wait);border-radius:8px;background:var(--panel)}
.row:hover{background:var(--panel-2)}
.row:focus-visible{outline:2px solid var(--accent)}
.row.s-ok{border-color:var(--ok);border-left-color:var(--ok);background:var(--ok-bg)} .row.s-ok:hover{background:#D3EEDD}
.row.s-fail{border-left-color:var(--fail);background:var(--fail-bg)} .row.s-miss{border-left-color:var(--fail)}
.row.s-run{border-left-color:var(--run);background:var(--run-bg)} .row.s-hold{border-left-color:var(--hold)} .row.s-none{border-left-color:var(--line)}
.row .t b{display:block;font-family:var(--f-num);font-size:15px} .row .t small{display:block;font-size:10.5px;color:var(--muted);line-height:1.25}
.row .no{font-family:var(--f-num);font-size:22px;font-weight:700;line-height:1} .row .no small{font-family:var(--f-body);font-size:10px;font-weight:500;color:var(--muted);margin-left:1px}
.row .sg b{display:block;font-weight:600} .row .sg small{font-size:12px;color:var(--muted)}
.row .mid{min-width:0;display:grid;gap:5px}
.row .tx{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .up{font-size:12px;color:var(--muted);line-height:1.4;min-width:0}
.row .up div,.row .up a{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .up a{color:var(--accent);font-family:var(--f-num);text-decoration:none} .row .up a:hover{text-decoration:underline}
.pipe.mini li{font-size:11px} .pipe.mini li::before{width:15px;height:15px;font-size:9px}
@media (max-width:1300px){.row{grid-template-columns:58px 48px 58px 90px minmax(0,1fr) 58px}.row .up{display:none}}

.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,20,18,.35)}  /* 틀고정 머리(z 20)보다 위 */
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(480px,100%);background:var(--panel);border-left:1px solid var(--line);padding:20px 18px;overflow-y:auto;display:grid;align-content:start;gap:16px;box-shadow:-12px 0 30px -18px rgba(0,0,0,.4)}
.dh{display:flex;align-items:center;gap:10px}
.dh h3{margin:0;font-size:18px} .dh .x{margin-left:auto}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.steps .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--wait)}
.steps .ok .ic{background:var(--ok)} .steps .fail .ic{background:var(--fail)} .steps .run .ic{background:var(--run)} .steps .hold .ic{background:var(--hold)} .steps .skip .ic{background:var(--line)}
.steps small{display:block;color:var(--muted);font-size:12px}
.sheet{width:100%;border-collapse:collapse;font-size:12px}
.sheet th,.sheet td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.sheet th{background:var(--panel-2);font-weight:600;white-space:nowrap;width:120px}
.sheet td{overflow-wrap:anywhere}
.post{white-space:pre-wrap;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;margin:0}
.hist{display:grid;gap:6px}
.hist .h{display:grid;grid-template-columns:72px 58px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
/* 앱 탭 (강남언니 | 바비톡) */
.apptabs{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.apptabs button{all:unset;cursor:pointer;padding:7px 16px;border-radius:7px;font-weight:700;font-size:14px;color:var(--muted);display:inline-flex;gap:7px;align-items:center}
.apptabs button:focus-visible{outline:2px solid var(--accent)}
.apptabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.apptabs .dotn{font-family:var(--f-num);font-size:11px;padding:0 6px;border-radius:999px;background:var(--run-bg);color:var(--run)}
.apptabs .dotn:empty{display:none}
.apptabs .unni{color:#DB2777}   /* 강남언니 = 짙은 분홍 (2026-10-14 요청) */ .apptabs .babi{color:var(--r4)}
/* 바비톡 줄: 홀/짝 배지, 주제 칩, 제목 줄 */
.par{display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;color:#fff;background:var(--r4)}
.par.odd{background:var(--r5)}
.topic{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:#EFE8FB;color:#6A3CC8}
.row .tt{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tx.sm{color:var(--muted);font-size:12px}
.tile .other{position:absolute;left:5px;top:4px;font-size:9px;font-weight:700;color:#DB2777}
.tile .other.b{color:var(--r4)}
.logapp{display:inline-flex;gap:4px;margin-right:6px}
.logapp .btn.tiny[aria-pressed="true"]{background:var(--run-bg);border-color:var(--run);color:var(--run)}
.loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);font-size:15px;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

<body>
<div class="loading" id="loading">시트 읽는 중…</div>

<div class="wrap">
  <header class="top">
    <div class="brand"><small>폰보드 60–99</small><b>강언/바비톡 로테이션 대시보드 <span class="ver" id="ver"></span></b></div>
    <!-- 앱 탭: 누르면 아래 4분할이 그 앱 내용으로 바뀜. 옆 숫자 = 오늘 건수 -->
    <div class="apptabs" role="tablist">
      <button type="button" data-app="unni" role="tab"><span class="unni">●</span>강남언니 <span class="dotn" id="cntUnni"></span></button>
      <button type="button" data-app="babi" role="tab"><span class="babi">●</span>바비톡 <span class="dotn" id="cntBabi"></span></button>
    </div>
    <div class="today"><span class="d num" id="todayLabel"></span><span class="w" id="weekLabel"></span></div>
    <div class="tools">
      <span class="busy" id="busy"></span>
      <span class="sync" id="sync" hidden></span>
      <button class="auto" id="autoBtn" type="button" title="눌러서 켜기/끄기"><i></i><span id="autoText">자동 실행 …</span></button>
      <button class="btn" id="reloadBtn" type="button">시트 새로고침</button>
      <button class="btn primary" id="checkBtn" type="button">로그인 점검 (전체)</button>
    </div>
  </header>

  <!-- 4분할: 위 = 작업 목록 | 폰보드, 아래 = 달력 | 로그. 한 화면에 꽉 차고 칸마다 따로 스크롤 -->
  <div class="quad">
    <section class="panel q" id="jobsPanel">
      <div class="ph"><h2>작업 목록</h2><span class="sub" id="jobsSub"></span><div class="chips" id="jobChips"></div></div>
      <div class="qbody jobs" id="jobs"></div>
    </section>

    <section class="panel q boardpanel">
      <div class="ph"><h2>폰보드</h2><span class="sub" id="checked"></span></div>
      <div class="legend">
        <span><i class="sw" style="background:var(--ok)"></i>로그인됨</span>
        <span><i class="sw" style="background:var(--hold)"></i>로그인 안 됨</span>
        <span><i class="sw" style="background:var(--fail)"></i>판독 불가</span>
        <span><i class="sw" style="background:var(--gone)"></i>연결 안 됨</span>
        <span><i class="sw" style="box-shadow:inset 0 0 0 2px var(--accent)"></i>고른 날 작업 (색 = 로테이션)</span>
      </div>
      <div class="qbody">
        <div class="board" id="board"></div>
        <div class="alerts" id="alerts"></div>
      </div>
    </section>

    <section class="panel q calpanel">
      <div class="calhead">
        <button class="btn" id="prevBtn" type="button" aria-label="이전 달">◀</button>
        <h2 id="calTitle"></h2>
        <button class="btn" id="nextBtn" type="button" aria-label="다음 달">▶</button>
        <button class="btn" id="todayBtn" type="button">오늘</button>
        <span class="sub">날짜를 누르면 작업 목록이 그날로 바뀝니다</span>
        <div class="chips" id="monthChips"></div>
      </div>
      <div class="qbody">
        <div class="cal" id="cal"></div>
        <p class="calnote" id="calNote"></p>
      </div>
    </section>

    <section class="panel q logpanel">
      <div class="ph"><h2>로그</h2><span class="sub" id="logCount"></span>
        <div class="chips">
          <span class="logapp" id="logApp">
            <button class="btn tiny" type="button" data-log="all" aria-pressed="true">전체</button>
            <button class="btn tiny" type="button" data-log="unni" aria-pressed="false">강남언니</button>
            <button class="btn tiny" type="button" data-log="babi" aria-pressed="false">바비톡</button>
          </span>
          <button class="btn tiny" id="logOnlyBad" type="button" aria-pressed="false">문제만</button>
        </div></div>
      <div class="logbox" id="log" aria-live="polite"></div>
    </section>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden></aside>

<script>
const DAYS = '일월화수목금토';          // Date.getDay() 이름표 (일=0)
const WEEK_ORDER = '일월화수목금토';    // 달력 칸 순서 — 시트와 같은 일요일 시작 (unni/schedule.py WEEK_START)
const CLS = {'제외':'none','성공':'ok','완료':'ok','실패':'fail','보류':'hold','작업중':'run','예정':'wait','미실행':'miss','기록 없음':'none'};
const PHONE = {in:'로그인됨', out:'로그인 안 됨', unknown:'판독 불가', gone:'연결 안 됨'};
let M = null, PH = {}, view = null, sel = 1, today = null, busy = false;
// 앱 탭: 'unni'(강남언니) / 'babi'(바비톡). 같은 4분할을 앱에 따라 다른 데이터로 그림.
let APP = (() => { try { return localStorage.getItem('app') === 'babi' ? 'babi' : 'unni'; } catch (e) { return 'unni'; } })();
let AUTO_U = null, AUTO_B = null;                 // 두 앱 자동 실행 상태 (탭 숫자·겹침 표시에 둘 다 씀)
const isBabi = () => APP === 'babi';
const APP_NAME = {unni: '강남언니', babi: '바비톡'};

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isThisMonth = () => view && today && view.y === today.getFullYear() && view.m === today.getMonth() + 1;
const dayData = d => M.days[d - 1];

// ── 두 곳에서 같은 화면을 씁니다 ─────────────────────────────────────────────
//  PC 프로그램(pywebview): 파이썬 Api 를 바로 부름.
//  웹앱(구글 Apps Script, appsscript/DashWeb.html): PC 가 시트 '강언대시보드' 탭에 보낸 값을 읽고,
//  버튼은 시트 '강언대시보드명령' 탭에 명령을 남겨 PC 가 30초 안에 실행.
const IS_WEB = typeof google !== 'undefined' && google.script && google.script.run;
const STEP_NAMES = {unni: ['로그인', '지난 글 삭제', '새 글 업로드'], babi: ['로그인 확인', '지난 글 삭제', '새 글 업로드']};
let SNAP = null, CAN = !IS_WEB;   // CAN: 버튼을 쓸 수 있는지 (웹앱은 시트 주인만, 나머지는 보기 전용)
const gs = (fn, ...args) => new Promise((ok, bad) =>
  google.script.run.withSuccessHandler(ok).withFailureHandler(bad)[fn](...args));
async function fetchSnap() {
  const raw = await gs('dashSnapshot');
  if (!raw) throw new Error('PC 가 아직 값을 보내지 않았습니다 (대시보드 프로그램이 켜져 있는지 확인)');
  SNAP = JSON.parse(raw);
  return SNAP;
}
function webMonth(y, m, app = 'unni') {
  const src = app === 'babi' ? (SNAP.babi || {}).months : SNAP.months;
  const mm = src && src[`${y}-${m}`];
  if (!mm) throw new Error(`${y}년 ${m}월은 웹에서 볼 수 없습니다 (지난달~다음 달만)`);
  const out = JSON.parse(JSON.stringify(mm));
  out.days.forEach(dd => dd.jobs = dd.jobs.map(j => Object.assign(
    {status: '', deleted: '', uploaded: '', url: '', account: '', plan: '', busy: '', note: '', category: '',
     title: '', topic: '', parity: ''}, j, {
      text: SNAP.texts[j.key] || '',
      steps: (j.steps || []).map((s, i) => ({k: STEP_NAMES[app][i], s: s[0], n: s[1] || ''})),
    })));
  return out;
}
async function sendCmd(cmd, arg) {
  if (!CAN) throw new Error('보기 전용입니다');
  await gs('dashCommand', cmd, String(arg ?? ''));
  onLog(`웹에서 보낸 명령: ${cmd} ${arg ?? ''} — PC 가 30초 안에 실행합니다`);
}
const webApi = {
  month: async (y, m) => webMonth(y, m),
  phones: async () => SNAP.phones,
  auto_status: async () => SNAP.auto,
  logs: async () => SNAP.logs,
  version: async () => SNAP.version,
  reload: async () => { if (CAN) await sendCmd('reload'); await fetchSnap(); return 0; },
  set_auto: async on => { await sendCmd('auto', on ? 'on' : 'off'); return Object.assign({}, SNAP.auto, {enabled: on}); },
  run_now: async key => { await sendCmd('run_now', key); return 'PC 로 보냄 — 30초 안에 시작합니다'; },
  check_login: async nos => { await sendCmd('check_login', (nos || []).join(',')); return {ok: true}; },
  // 바비톡 탭
  babi_month: async (y, m) => webMonth(y, m, 'babi'),
  babi_phones: async () => (SNAP.babi || {}).phones || {},
  babi_auto_status: async () => (SNAP.babi || {}).auto || {},
  babi_reload: async () => { if (CAN) await sendCmd('babi_reload'); await fetchSnap(); return 0; },
  babi_set_auto: async on => { await sendCmd('babi_auto', on ? 'on' : 'off');
    return Object.assign({}, (SNAP.babi || {}).auto, {enabled: on}); },
  babi_run_now: async key => { await sendCmd('babi_run_now', key); return 'PC 로 보냄 — 30초 안에 시작합니다'; },
  babi_check_login: async nos => { await sendCmd('babi_check_login', (nos || []).join(',')); return {ok: true}; },
};
const API = () => IS_WEB ? webApi : pywebview.api;
// 지금 고른 앱의 함수: call('month', y, m) → 강남언니는 month, 바비톡은 babi_month
const call = (name, ...a) => API()[(isBabi() ? 'babi_' : '') + name](...a);

// 로그: 최근 LOG_MAX 줄만 남기고(오래 켜 두면 느려짐), 문제는 빨강·완료는 초록·미리 로그인은 파랑.
const LOG_MAX = 300;
const logLines = [];
let logOnlyBad = false, logApp = 'all';
const logKind = s => /!!|실패|오류|못 |안 됨|없음 —|불일치/.test(s) ? 'err'
  : /완료|등록됨|성공|로그인됨|삭제됨/.test(s) ? 'ok'
  : /미리 로그인|시작 시각|자동 실행/.test(s) ? 'info' : '';
function renderLog() {
  const el = $('log');
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;   // 위로 올려 읽는 중이면 안 끌어내림
  // 앱 거르기: 바비톡 로그는 파이썬이 '[바비톡]' 을 앞에 붙여 보냄
  const shown = logLines.filter(x => (!logOnlyBad || x.kind === 'err') &&
    (logApp === 'all' || (logApp === 'babi') === x.line.startsWith('[바비톡]')));
  el.innerHTML = shown.length ? shown.map(x => `<div class="ln ${x.kind}"><time>${x.t}</time><span>${esc(x.line)}</span></div>`).join('')
    : `<div class="empty-log">${logOnlyBad ? '문제 기록이 없습니다.' : '아직 기록이 없습니다.'}</div>`;
  const bad = logLines.filter(x => x.kind === 'err').length;
  $('logCount').textContent = `${logLines.length}줄${bad ? ` · 문제 ${bad}` : ''}`;
  if (atBottom) el.scrollTop = el.scrollHeight;
}
// at: 파이썬이 붙인 'HH:MM:SS' (다시 켰을 때 지난 로그를 불러올 때도 같은 시각으로 보이게)
window.onLog = (line, at) => {
  const t = new Date();
  const text = String(line).replace(/^\s+/, '');
  if (!text) return;
  logLines.push({t: at || `${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`, line: text, kind: logKind(text)});
  if (logLines.length > LOG_MAX) logLines.splice(0, logLines.length - LOG_MAX);
  renderLog();
};
// 로그는 지우는 버튼을 두지 않습니다 (실수로 눌러 기록이 사라진 적 있음). '문제만' 은 보기만 바꿈.
$('logOnlyBad').onclick = e => { logOnlyBad = !logOnlyBad; e.currentTarget.setAttribute('aria-pressed', logOnlyBad); renderLog(); };
$('logApp').querySelectorAll('button').forEach(b => b.onclick = () => {
  logApp = b.dataset.log;
  $('logApp').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  renderLog();
});
renderLog();

function setBusy(text) {
  busy = !!text;
  $('busy').textContent = text || '';
  ['reloadBtn', 'checkBtn'].forEach(id => $(id).disabled = busy);
  document.querySelectorAll('[data-check]').forEach(b => b.disabled = busy);
}

async function loadMonth() {
  M = await call('month', view.y, view.m);
  today = new Date(M.today + 'T00:00:00');
}

function renderTop() {
  // 주차는 파이썬(unni/schedule.py, 월요일 시작)이 계산한 값을 그대로 씁니다.
  const d = today.getDate(), dd = isThisMonth() ? dayData(d) : null;
  $('todayLabel').textContent = `${today.getFullYear()}.${pad(today.getMonth() + 1)}.${pad(d)} (${DAYS[today.getDay()]})`;
  $('weekLabel').textContent = !dd ? '' : dd.skip ? '6주차 — 오늘은 작업 없음'
    : (isBabi() && M.parity ? `${M.parity} 달 · ` : '') + `시트 기준 ${dd.week}주차 ${dd.dn}요일`;
}

function timeNote(j) {
  if (j.uploaded) return '업로드됨';
  if (j.busy) return j.busy + ' 중';
  if (j.note) return j.note;
  if (j.plan) return `${j.hour}시 안 무작위`;
  return '시간대';
}

function counts(jobs) {
  const c = {};
  jobs.forEach(j => c[j.state] = (c[j.state] || 0) + 1);
  return c;
}
const chipsHTML = c => Object.entries(c).map(([k, v]) => `<span class="chip c-${CLS[k] || 'wait'}">${k} ${v}</span>`).join('');

function renderJobs() {
  const dd = dayData(sel), el = $('jobs');
  const label = `${view.m}월 ${sel}일 (${dd.dn})`;
  if (dd.skip) {
    $('jobsSub').textContent = `${label} · 6주차`;
    $('jobChips').innerHTML = '';
    el.innerHTML = '<div class="empty">6주차에 걸린 날이라 시트에 배정된 작업이 없습니다.</div>';
    return;
  }
  const isToday = isThisMonth() && sel === today.getDate();
  $('jobsSub').textContent = `${label} · ${isBabi() && M.parity ? M.parity + ' ' : ''}${dd.week}주차 ${dd.dn}요일 · ${dd.jobs.length}건${isToday ? ' · 오늘' : ''}`;
  $('jobChips').innerHTML = chipsHTML(counts(dd.jobs));
  if (!dd.jobs.length) { el.innerHTML = '<div class="empty">이 날은 작업이 없습니다.</div>'; return; }
  if (isBabi()) return renderBabiJobs(dd, el);
  // 한 줄 = 시각 | 폰 | 로테 | 수술부위·게시판 | 글 첫 줄 + 3단계 | 업로드 결과(시각·주소·계정) | 상태
  el.innerHTML = dd.jobs.map((j, i) => {
    const first = (j.text || '').split('\n')[0];
    const result = j.uploaded
      ? `<div>${esc(j.uploaded)}</div><a href="${esc(j.url)}" target="_blank" rel="noopener" title="새 창에서 글 열기">${esc(j.url.replace('https://', ''))}</a><div title="${esc(j.account)}">${esc(j.account)}</div>`
      : `<div title="${esc(j.status)}">${j.busy ? esc(j.busy) + ' 중' : j.note ? esc(j.note)
          : j.state === '예정' ? (j.plan ? j.plan + ' 시작 예정' : '아직 안 올라감') : esc(j.status) || '기록 없음'}</div>`;
    return `
    <button type="button" class="row s-${CLS[j.state]}" data-i="${i}">
      <span class="t"><b>${j.plan && !j.uploaded ? j.plan : pad(j.hour) + '시'}</b><small>${esc(timeNote(j))}</small></span>
      <span class="no">${j.board}<small>번</small></span>
      <span class="rot r${j.rot}">로테 ${j.rot}</span>
      <span class="sg"><b>${esc(j.surgery)}</b><small>${esc(j.category)}</small></span>
      <span class="mid"><span class="tx" title="${esc(j.text)}">${esc(first)}</span>
        <ol class="pipe mini">${j.steps.map(s => `<li class="${s.s}" title="${esc(s.n)}"><span>${s.k}</span></li>`).join('')}</ol></span>
      <span class="up">${result}</span>
      <span class="pill c-${CLS[j.state]}">${j.state}</span>

    openJob(dd.jobs[+b.dataset.i], dd);
  });
}

      <span class="no">${j.board}<small>번</small></span>

function renderBoard() {
  const dd = dayData(sel);
  // 같은 폰보드를 다른 앱이 지금 쓰고 있으면 칸 왼쪽 위에 표시 (겹치면 끝날 때까지 기다림)
  const other = ((isBabi() ? AUTO_U : AUTO_B) || {}).busy || {};
  const otherName = isBabi() ? '강언' : '바비';
  const assigned = new Map((dd.skip ? [] : dd.jobs).map(j => [j.board, j]));
  const times = Object.values(PH).map(p => p.at).filter(Boolean).sort();
  $('checked').textContent = times.length ? `마지막 점검 ${times[times.length - 1]}` : '아직 점검 안 함';
  const el = $('board');
  el.innerHTML = '';
  for (let n = 60; n <= 99; n++) {
    const p = PH[n] || {}, st = p.state || 'none', j = assigned.get(n);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = `tile ${st}${j ? ' assigned' : ''}`;
    b.title = `${n}번 · ${PHONE[st] || '미점검'}${p.nick ? ' · ' + p.nick : ''}${p.why ? '\n' + p.why : ''}`;
    // 로그인 안 된 칸은 '왜' 를 짧게 (비번 불일치 / VPN 문제 / 인터넷 경로 없음 / USB 끊김 …)
    const rt = !j ? '-' : isBabi() ? `${j.parity ? j.parity + ' ' : ''}${j.hour}시` : `로테${j.rot} ${j.hour}시`;
    const rc = !j ? 'none' : isBabi() ? 'r4' : 'r' + j.rot;
    b.innerHTML = `${other[n] ? `<span class="other${isBabi() ? '' : ' b'}" title="${otherName} ${esc(other[n])} 중">${otherName}</span>` : ''}<span class="dot"></span><b>${n}</b>
      <span class="lb">${esc(st === 'in' && p.nick ? p.nick : (p.tag || PHONE[st] || '미점검'))}</span>
      <span class="rt ${rc}">${rt}</span>`;
    b.onclick = () => openPhone(n);
    el.appendChild(b);
  }
  // 같은 이유끼리 묶음 → 접힌 줄엔 이유별 개수만 (바비톡 본인인증 30대처럼 많으면 화면을 다 차지해서)
  const groups = new Map();
  for (let n = 60; n <= 99; n++) {
    const p = PH[n]; if (!p || p.state === 'in') continue;
    const tag = p.tag || {unknown: '판독 불가', out: '로그인 안 됨', gone: '연결 안 됨'}[p.state] || '확인 필요';
    const cls = p.state === 'gone' ? 'c-gone' : p.state === 'out' && tag === '로그아웃' ? 'c-hold' : 'c-fail';
    // '인터넷 안 됨 — …', '로그아웃 상태 — …' 처럼 칩과 같은 말로 시작하면 앞부분은 떼고 설명만
    let why = p.why || '';
    const cut = why.indexOf(' — ');
    if (cut > 0 && cut <= 12) why = why.slice(cut + 3);
    if (!groups.has(tag)) groups.set(tag, {cls, nos: [], whys: new Set()});
    const g = groups.get(tag);
    g.nos.push(n); if (why) g.whys.add(why);
  }
  const total = [...groups.values()].reduce((a, g) => a + g.nos.length, 0);
  if (!total) { $('alerts').innerHTML = ''; return; }
  const rows = [...groups].map(([tag, g]) => {
    const nums = g.nos.map(n => { const j = assigned.get(n);
      return `<b${j ? ` class="wk" title="이날 ${j.hour}시 작업"` : ''}>${n}</b>`; }).join('');
    const why = g.whys.size === 1 ? [...g.whys][0] : g.whys.size ? '폰마다 다름 — 칸을 눌러 확인' : '';
    return `<div class="alert ${g.cls}"><span class="an">${g.nos.length}대</span><span class="at">${esc(tag)}</span>
      <span class="ad"><span class="nums">${nums}</span>${why ? `<div>${esc(why)}</div>` : ''}</span></div>`;
  }).join('');
  const chips = [...groups].map(([tag, g]) => `<span class="sc ${g.cls}">${esc(tag)} ${g.nos.length}</span>`).join('');
  let open = false;
  try { open = localStorage.getItem('alertsOpen') === '1'; } catch (e) { /* 기본은 접힘 */ }
  $('alerts').innerHTML = `<details${open ? ' open' : ''}><summary>문제 폰 ${total}대 ${chips}</summary>
    <div class="ab">${rows}<div class="sub" style="font-size:11px">테두리 색 번호 = 고른 날 작업 있는 폰</div></div></details>`;
  $('alerts').querySelector('details').addEventListener('toggle', e => {
    try { localStorage.setItem('alertsOpen', e.target.open ? '1' : '0'); } catch (err) { /* 저장 못 해도 동작 */ }
  });
}

function renderCal() {
  $('calTitle').innerHTML = `${view.y}년 ${view.m}월` + (isBabi() && M.parity
    ? ` <span class="par${M.parity === '홀' ? ' odd' : ''}" style="vertical-align:middle">${M.parity}</span>` : '');
  let h = WEEK_ORDER.split('').map(x => `<div class="hd${x === '일' ? ' sun' : ''}">${x}</div>`).join('');
  for (let i = 0; i < M.offset; i++) h += '<div class="day blank" aria-hidden="true"></div>';
  const skipped = [], mc = {};
  const tday = isThisMonth() ? today.getDate() : (new Date(view.y, view.m - 1, 1) < today ? 99 : 0);
  M.days.forEach(dd => {
    const d = dd.day;
    if (dd.skip) {
      skipped.push(d);
      h += `<div class="day skip6"><div class="tr"><span class="dn">${d}</span><span class="wk">6주차</span></div><span class="cnt">건너뜀</span></div>`;
      return;
    }
    const c = counts(dd.jobs);
    Object.entries(c).forEach(([k, v]) => mc[k] = (mc[k] || 0) + v);
    const bad = (c['실패'] || 0) + (c['보류'] || 0) + (c['미실행'] || 0);
    c['완료'] = (c['성공'] || 0) + (c['완료'] || 0);
    const cls = ['day', d < tday ? 'past' : '', d === tday ? 'is-today' : '', d === sel ? 'sel' : ''].join(' ');
    h += `<button type="button" class="${cls}" data-d="${d}">
      <div class="tr"><span class="dn">${d}</span><span class="wk">${dd.week}주 ${dd.dn}</span></div>
      <div class="dots">${dd.jobs.map(j => `<i class="${CLS[j.state]}"></i>`).join('')}</div>
      <span class="cnt">${dd.jobs.length}건${c['완료'] ? ` · 완료 ${c['완료']}` : ''}${bad ? ` · <b style="color:var(--fail)">문제 ${bad}</b>` : ''}</span></button>`;
  });
  $('cal').innerHTML = h;
  $('cal').querySelectorAll('button.day').forEach(b => b.onclick = () => {
    sel = +b.dataset.d;
    renderDay();
    $('jobs').scrollTop = 0;                         // 작업 목록 칸을 그날 맨 위로
  });
  $('monthChips').innerHTML = chipsHTML(mc);
  $('calNote').textContent = skipped.length ? `6주차에 걸린 ${skipped.join(', ')}일은 시트에 배정이 없어 건너뜁니다.`
    : '이번 달은 6주차로 빠지는 날이 없습니다.';
}

function armRunNow(j) {
  const b = $('runNow');
  let armed = false;
  b.onclick = async () => {

async function checkLogin(nos) {
  if (busy) return;
  setBusy(`로그인 점검 중… (${nos.length}대)`);
  try {
    await call('check_login', nos);
    PH = await call('phones');
    renderBoard();
    if (!$('drawer').hidden && nos.length === 1) openPhone(nos[0]);
  } finally { setBusy(''); }
}

async function goto(y, m) {
  view = {y, m};
  await loadMonth();
  sel = isThisMonth() ? today.getDate() : 1;
  renderDay();
}

$('nextBtn').onclick = () => goto(view.m === 12 ? view.y + 1 : view.y, view.m === 12 ? 1 : view.m + 1);

$('checkBtn').onclick = () => checkLogin([...Array(40)].map((_, i) => 60 + i));
$('reloadBtn').onclick = async () => {
  if (busy) return;
  setBusy('시트 읽는 중…');
  try {
    await call('reload'); lastSheetRead = Date.now();

// 켜 둔 채로 날이 바뀌면 오늘·고른 날짜를 새 날로 옮기고, 5분마다 시트를 다시 읽어
// 업로드 결과가 저절로 반영되게 합니다. (예전엔 켤 때 한 번만 날짜를 읽어 다음 날에도
// 전날 요일이 그대로 보였음)
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
let lastSheetRead = Date.now();
async function tick() {
  if (IS_WEB || busy || !today) return;          // 웹앱은 webRefresh 가 대신함
  try { await refreshAuto(); } catch (e) { /* 다음 분에 다시 */ }
  try {                                           // 폰보드는 매분 (작업 중 로그인 결과·웹에서 보낸 점검도 바로 보이게)
    const ph = await call('phones');
    if (JSON.stringify(ph) !== JSON.stringify(PH)) { PH = ph; renderBoard(); }
  } catch (e) { /* 다음 분에 다시 */ }
  const now = new Date();
  const dayChanged = ymd(now) !== ymd(today);
  const sheetDue = Date.now() - lastSheetRead > 5 * 60 * 1000;
  if (!dayChanged && !sheetDue) return;
  try {
    if (sheetDue) { await call('reload'); lastSheetRead = Date.now(); }
    if (dayChanged) {
      const wasOnToday = isThisMonth() && sel === today.getDate();
      if (wasOnToday || isThisMonth()) view = {y: now.getFullYear(), m: now.getMonth() + 1};
      await loadMonth();
      if (wasOnToday || isThisMonth()) sel = today.getDate();
      onLog(`날짜가 바뀌어 ${ymd(today)} 기준으로 다시 그림`);
    } else {
      await loadMonth();
    }
    PH = await call('phones');
    renderTop(); renderDay();
  } catch (e) { onLog('자동 새로고침 실패: ' + e); }
}
setInterval(tick, 60 * 1000);

// 자동 실행 상태
let AUTO = null;
function renderAuto() {
  if (!AUTO) return;
  const b = $('autoBtn');
  const range = AUTO.from || AUTO.until
    ? ` · ${(AUTO.from || '').slice(5).replace('-', '/')}~${(AUTO.until || '').slice(5).replace('-', '/')}` : '';
  b.classList.toggle('on', AUTO.enabled && AUTO.today_in_window);
  b.classList.toggle('off-window', AUTO.enabled && !AUTO.today_in_window);
  const busyN = Object.keys(AUTO.busy || {}).length;
  $('autoText').textContent = APP_NAME[APP] + ' ' + (AUTO.enabled ? (AUTO.today_in_window ? '자동 실행 켜짐' : '자동 실행 켜짐 (오늘은 기간 밖)')
    : '자동 실행 꺼짐') + range + (busyN ? ` · 진행 ${busyN}대` : '');
  renderAppTabs();
}
// 두 앱 상태를 같이 읽음 — 탭 숫자(오늘 건수)와 '다른 앱이 쓰는 폰' 표시에 씀
async function refreshAuto() {
  [AUTO_U, AUTO_B] = await Promise.all([API().auto_status(), API().babi_auto_status()]);
  AUTO = isBabi() ? AUTO_B : AUTO_U;
  renderAuto();
}
function renderAppTabs() {
  document.querySelectorAll('.apptabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.app === APP));
  const n = a => !a ? '' : a.count != null ? a.count : a.planned ? Object.keys(a.planned).length : '';
  $('cntUnni').textContent = n(AUTO_U);
  $('cntBabi').textContent = n(AUTO_B);
}
async function switchApp(app) {
  if (app === APP || busy) return;
  APP = app;
  try { localStorage.setItem('app', app); } catch (e) { /* 저장 못 해도 동작 */ }
  closeDrawer();
  AUTO = isBabi() ? AUTO_B : AUTO_U;
  renderAuto();
  try {
    PH = await call('phones');
    await loadMonth();
    if (!isThisMonth()) sel = Math.min(sel, M.days.length);
    renderTop(); renderDay();
  } catch (e) { onLog(`${APP_NAME[app]} 화면을 못 불러옴: ${e && e.message || e}`); }
}
document.querySelectorAll('.apptabs button').forEach(b => b.onclick = () => switchApp(b.dataset.app));
$('autoBtn').onclick = async () => {
  if (!CAN) return;
  AUTO = await call('set_auto', !(AUTO && AUTO.enabled));
  if (isBabi()) AUTO_B = AUTO; else AUTO_U = AUTO;
  renderAuto();
};
// 파이썬 스케줄러가 작업 시작/끝, 미리 로그인을 알릴 때
let autoTimer = null;
window.onAuto = () => {
  clearTimeout(autoTimer);
  autoTimer = setTimeout(async () => {
    try {
      await refreshAuto();
      await call('reload', true); lastSheetRead = Date.now();
      await loadMonth();
      PH = await call('phones');
      renderDay();
    } catch (e) { onLog('화면 갱신 실패: ' + e); }
  }, 800);
};

async function boot() {
  try {
    if (IS_WEB) {
      await fetchSnap();
      try { CAN = (await gs('dashWho')).control; } catch (e) { CAN = true; }   // 예전 Dash.gs(주인만 열림)엔 dashWho 가 없음
      document.body.classList.toggle('readonly', !CAN);
    }
    const now = IS_WEB ? new Date(SNAP.today + 'T00:00:00') : new Date();
    $('ver').textContent = 'v' + await API().version() + (IS_WEB ? ' · 웹' : '');
    // 다시 켰을 때 파이썬이 들고 있던 최근 로그부터 보여 줌
    for (const [at, line] of await API().logs()) onLog(line, at);
    PH = await call('phones');
    view = {y: now.getFullYear(), m: now.getMonth() + 1};
    await loadMonth();
    sel = today.getDate();
    renderTop(); renderDay();
    await refreshAuto();
    renderSync();
    $('loading').hidden = true;
  } catch (e) {
    $('loading').textContent = (IS_WEB ? '' : '시트를 읽지 못했습니다: ') + (e && e.message || e);
  }
}

// 웹앱: 30초마다 PC 가 보낸 새 값이 있으면 다시 그림. 위쪽에 'PC 기준 시각' 과 끊김 경고.
function renderSync() {
  if (!IS_WEB || !SNAP) return;
  const sent = new Date(SNAP.sent_at.replace(' ', 'T'));
  const min = Math.round((Date.now() - sent.getTime()) / 60000);
  const el = $('sync');
  el.hidden = false;
  el.textContent = (CAN ? '' : '보기 전용 · ') + `PC 기준 ${SNAP.sent_at.slice(11, 16)}` + (min > 6 ? ` · ${min}분째 소식 없음 — PC 확인` : '');
  el.classList.toggle('stale', min > 6);
}
async function webRefresh() {
  if (!$('loading').hidden) return boot();         // 처음 열 때 PC 값이 아직 없었으면 다시 시도
  try {
    const before = SNAP && SNAP.sent_at;
    await fetchSnap();
    if (SNAP.sent_at !== before) {
      logLines.length = 0;
      for (const [at, line] of SNAP.logs) onLog(line, at);
      PH = await call('phones');
      AUTO_U = SNAP.auto; AUTO_B = (SNAP.babi || {}).auto || null;
      AUTO = isBabi() ? AUTO_B : AUTO_U;
      today = new Date(SNAP.today + 'T00:00:00');
      await loadMonth(); renderTop(); renderDay(); renderAuto();
    }
  } catch (e) { /* 다음 번에 다시 */ }
  renderSync();
}

if (IS_WEB) { boot(); setInterval(webRefresh, 30 * 1000); }
else window.addEventListener('pywebviewready', boot);
</script>
</body>
</html>
